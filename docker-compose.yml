---
services:
  s-ui:
    image: alireza7/s-ui
    container_name: s-ui
    hostname: "s-ui"
    volumes:
      - s-ui-db:/app/db       # 将 ./db 改为命名卷 s-ui-db
      - s-ui-cert:/app/cert   # 将 ./cert 改为命名卷 s-ui-cert
    tty: true
    restart: unless-stopped
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "8801:8801/udp"
      - "18645:2095/tcp"
      - "37963:2096/tcp"
    networks:
      - s-ui
    entrypoint: "./entrypoint.sh"

networks:
  s-ui:
    driver: bridge

# 关键：必须在顶层声明所使用的命名卷
volumes:
  s-ui-db:
  s-ui-cert:
